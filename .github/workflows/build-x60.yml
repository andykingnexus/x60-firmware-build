name: Build Ruijie RG-X60 Firmware

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "忽略 ccache，执行干净编译"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      - "defconfig/x60.config"
      - ".github/workflows/build-x60.yml"

permissions:
  contents: read

concurrency:
  group: build-ruijie-rg-x60-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Seoul

  OPENWRT_REPO: https://github.com/RuijieNetworksCommunity/MT798X-6.6-24.10
  OPENWRT_BRANCH: openwrt-24.10-6.6
  OPENWRT_DIR: openwrt

  CONFIG_FILE: defconfig/x60.config

  DEVICE_NAME: ruijie-rg-x60
  DEVICE_CONFIG: CONFIG_TARGET_mediatek_filogic_DEVICE_ruijie-rg-x60

  OUTPUT_DIR: bin/targets/mediatek/filogic
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    name: Build RG-X60
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Validate local files
        shell: bash
        run: |
          set -euo pipefail

          test -f "${CONFIG_FILE}" || {
            echo "ERROR: 找不到 ${CONFIG_FILE}"
            exit 1
          }

          echo "配置文件：${CONFIG_FILE}"
          sha256sum "${CONFIG_FILE}"

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo docker system prune --all --force || true

          df -h

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            genisoimage \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            lrzsz \
            msmtp \
            nano \
            ninja-build \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-docutils \
            python3-pip \
            python3-ply \
            python3-pyelftools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xsltproc \
            xxd \
            zlib1g-dev \
            zstd

          sudo apt-get clean

      - name: Clone Ruijie OpenWrt source
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --filter=blob:none \
            --single-branch \
            --branch "${OPENWRT_BRANCH}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          cd "${OPENWRT_DIR}"

          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "SOURCE_SHORT_SHA=$(git rev-parse --short=8 HEAD)" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=$(date +'%Y.%m.%d')" >> "${GITHUB_ENV}"
          echo "BUILD_ID=$(date +'%Y%m%d-%H%M')" >> "${GITHUB_ENV}"

          echo "源码分支：$(git branch --show-current)"
          echo "源码提交：$(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Fix HNAT kernel dependency
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          PATCH_ROOT="target/linux/mediatek/patches-6.6"

          OLD_DEP='depends on NET_MEDIATEK_SOC && NF_CONNTRACK && IP_NF_NAT'
          NEW_DEP='depends on NET_MEDIATEK_SOC && NF_CONNTRACK && NF_NAT'

          test -d "${PATCH_ROOT}" || {
            echo "ERROR: 找不到 ${PATCH_ROOT}"
            exit 1
          }

          mapfile -t OLD_FILES < <(
            grep -RIl \
              --include='*.patch' \
              -F "${OLD_DEP}" \
              "${PATCH_ROOT}" || true
          )

          mapfile -t NEW_FILES < <(
            grep -RIl \
              --include='*.patch' \
              -F "${NEW_DEP}" \
              "${PATCH_ROOT}" || true
          )

          echo "旧依赖文件数：${#OLD_FILES[@]}"
          printf '%s\n' "${OLD_FILES[@]:-}"

          echo "新依赖文件数：${#NEW_FILES[@]}"
          printf '%s\n' "${NEW_FILES[@]:-}"

          if (( ${#OLD_FILES[@]} == 1 )); then
            TARGET_PATCH="${OLD_FILES[0]}"

            python3 - "${TARGET_PATCH}" "${OLD_DEP}" "${NEW_DEP}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          old = sys.argv[2]
          new = sys.argv[3]

          text = path.read_text(encoding="utf-8")
          count = text.count(old)

          if count != 1:
              raise SystemExit(
                  f"ERROR: expected one HNAT dependency, found {count}"
              )

          path.write_text(
              text.replace(old, new, 1),
              encoding="utf-8",
          )
          PY

          elif (( ${#OLD_FILES[@]} == 0 && ${#NEW_FILES[@]} >= 1 )); then
            echo "HNAT 内核补丁已使用通用 NF_NAT，无需修改。"

          else
            echo "ERROR: HNAT 内核依赖匹配数量异常。"

            grep -Rns \
              --include='*.patch' \
              -E 'NET_MEDIATEK_SOC.*NF_CONNTRACK.*(IP_NF_NAT|NF_NAT)' \
              "${PATCH_ROOT}" || true

            exit 1
          fi

          if grep -Rqs \
            --include='*.patch' \
            -F "${OLD_DEP}" \
            "${PATCH_ROOT}"
          then
            echo "ERROR: 修改后仍存在 IP_NF_NAT 强依赖。"
            exit 1
          fi

          if ! grep -Rqs \
            --include='*.patch' \
            -F "${NEW_DEP}" \
            "${PATCH_ROOT}"
          then
            echo "ERROR: 修改后没有找到通用 NF_NAT 依赖。"
            exit 1
          fi

          echo "最终 HNAT 内核依赖："

          grep -Rns \
            --include='*.patch' \
            -F "${NEW_DEP}" \
            "${PATCH_ROOT}"

      - name: Update and install feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          ./scripts/feeds update -a \
            2>&1 | tee ../feeds-update.log

          ./scripts/feeds install -a \
            2>&1 | tee ../feeds-install.log

      - name: Fix HNAT package dependencies
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===== 搜索 HNAT OpenWrt 包定义 ====="

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          roots = [
              Path("package"),
              Path("target"),
              Path("feeds"),
          ]

          markers = (
              "mediatek_hnat",
              "mediatek-hnat",
              "mtkhnat",
              "mtk_hnat",
              "mtk-hnat",
              "kmod-mediatek_hnat",
              "kmod-mediatek-hnat",
          )

          old_dependencies = (
              "+kmod-ipt-conntrack",
              "+kmod-ipt-nat",
          )

          candidate_files = []

          for root in roots:
              if not root.exists():
                  continue

              paths = list(root.rglob("Makefile"))
              paths.extend(root.rglob("*.mk"))

              for path in paths:
                  try:
                      text = path.read_text(
                          encoding="utf-8",
                          errors="ignore",
                      )
                  except OSError:
                      continue

                  lower = text.lower()

                  if any(marker in lower for marker in markers):
                      candidate_files.append(path)

          candidate_files = sorted(set(candidate_files))

          print("HNAT 相关包定义文件：")

          for path in candidate_files:
              print(f"  {path}")

          if not candidate_files:
              print(
                  "ERROR: 没有找到 HNAT OpenWrt 包定义。",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          old_matches = []

          for path in candidate_files:
              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore",
              )

              for dependency in old_dependencies:
                  count = text.count(dependency)

                  if count:
                      old_matches.append(
                          (path, dependency, count)
                      )

          print("\n旧依赖匹配：")

          for path, dependency, count in old_matches:
              print(
                  f"  {path}: {dependency}: {count} 处"
              )

          total_old = sum(
              count for _, _, count in old_matches
          )

          if total_old == 0:
              already_fixed = False

              for path in candidate_files:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )

                  if (
                      "+kmod-nf-conntrack" in text
                      and "+kmod-nf-nat" in text
                  ):
                      already_fixed = True
                      print(
                          "\nHNAT 包定义已使用 "
                          "kmod-nf-conntrack 和 kmod-nf-nat："
                      )
                      print(f"  {path}")

              if already_fixed:
                  raise SystemExit(0)

              print(
                  "ERROR: 找到了 HNAT 包定义，但没有找到"
                  "旧 iptables 依赖，也没有找到新的通用"
                  " netfilter 依赖。",
                  file=sys.stderr,
              )

              print(
                  "\n所有 kmod-ipt-conntrack 引用：",
                  file=sys.stderr,
              )

              for root in roots:
                  if not root.exists():
                      continue

                  for path in list(root.rglob("Makefile")) + \
                              list(root.rglob("*.mk")):
                      try:
                          text = path.read_text(
                              encoding="utf-8",
                              errors="ignore",
                          )
                      except OSError:
                          continue

                      if "kmod-ipt-conntrack" in text:
                          for number, line in enumerate(
                              text.splitlines(),
                              start=1,
                          ):
                              if "kmod-ipt-conntrack" in line:
                                  print(
                                      f"{path}:{number}:{line}",
                                      file=sys.stderr,
                                  )

              raise SystemExit(1)

          if total_old > 2:
              print(
                  "ERROR: HNAT 包定义中的旧依赖匹配过多，"
                  f"实际为 {total_old} 处。",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          changed_files = []

          for path in candidate_files:
              text = path.read_text(
                  encoding="utf-8",
                  errors="strict",
              )
              original = text

              text = text.replace(
                  "+kmod-ipt-conntrack",
                  "+kmod-nf-conntrack +kmod-nf-nat",
              )

              text = text.replace(
                  "+kmod-ipt-nat",
                  "+kmod-nf-nat",
              )

              text = re.sub(
                  r"(\+kmod-nf-nat)"
                  r"(?:[ \t]+\+kmod-nf-nat)+",
                  r"\1",
                  text,
              )

              text = re.sub(
                  r"(\+kmod-nf-conntrack)"
                  r"(?:[ \t]+\+kmod-nf-conntrack)+",
                  r"\1",
                  text,
              )

              if text != original:
                  path.write_text(
                      text,
                      encoding="utf-8",
                  )
                  changed_files.append(path)

          if not changed_files:
              print(
                  "ERROR: 找到了旧依赖但没有修改任何文件。",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print("\n已修改文件：")

          for path in changed_files:
              print(f"  {path}")

          remaining = []

          for path in candidate_files:
              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore",
              )

              for dependency in old_dependencies:
                  if dependency in text:
                      remaining.append(
                          (path, dependency)
                      )

          if remaining:
              print(
                  "ERROR: 修改后仍存在 HNAT 旧依赖：",
                  file=sys.stderr,
              )

              for path, dependency in remaining:
                  print(
                      f"  {path}: {dependency}",
                      file=sys.stderr,
                  )

              raise SystemExit(1)

          new_dependency_found = False

          for path in candidate_files:
              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore",
              )

              if (
                  "+kmod-nf-conntrack" in text
                  and "+kmod-nf-nat" in text
              ):
                  new_dependency_found = True

          if not new_dependency_found:
              print(
                  "ERROR: 修改后没有检测到完整的通用 "
                  "netfilter 依赖。",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print(
              "\nOK: HNAT 包级依赖已改为 "
              "kmod-nf-conntrack + kmod-nf-nat"
          )
          PY

          echo
          echo "===== 修改后的 HNAT 包依赖 ====="

          grep -Rns \
            --include='Makefile' \
            --include='*.mk' \
            -E 'mediatek[_-]?hnat|mtk[_-]?hnat|kmod-nf-(conntrack|nat)' \
            package target feeds 2>/dev/null |
            head -n 100 || true

      - name: Restore ccache
        if: >-
          ${{ github.event_name != 'workflow_dispatch' ||
          inputs.clean_build == false }}
        uses: actions/cache@v4
        with:
          path: .ccache
          key: >-
            rg-x60-${{ runner.os }}-${{
            hashFiles(
            'defconfig/x60.config',
            '.github/workflows/build-x60.yml'
            ) }}
          restore-keys: |
            rg-x60-${{ runner.os }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${CCACHE_DIR}"

          ccache --set-config=cache_dir="${CCACHE_DIR}"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache --zero-stats

          ccache --show-config

      - name: Apply config and remove legacy firewall stack
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cp "../${CONFIG_FILE}" .config

          echo "===== 初次解析配置 ====="

          make defconfig \
            2>&1 | tee ../defconfig-initial.log

          clean_config() {
            python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(".config")
          lines = path.read_text(
              encoding="utf-8",
          ).splitlines()

          exact_disable = {
              # 不内置 dae。
              "CONFIG_PACKAGE_dae",
              "CONFIG_PACKAGE_daed",
              "CONFIG_PACKAGE_luci-app-daede",

              # 不需要的应用。
              "CONFIG_PACKAGE_luci-app-passwall",
              "CONFIG_PACKAGE_luci-app-ssr-plus",
              "CONFIG_PACKAGE_luci-app-vssr",
              "CONFIG_PACKAGE_luci-app-rclone",
              "CONFIG_PACKAGE_luci-app-eqos",
              "CONFIG_PACKAGE_luci-app-eqos-mtk",
              "CONFIG_PACKAGE_luci-app-upnp",
              "CONFIG_PACKAGE_miniupnpd",
              "CONFIG_PACKAGE_miniupnpd-nftables",

              # 会重新拉入 iptables/fullcone/physdev。
              "CONFIG_PACKAGE_luci-app-turboacc-mtk",
              "CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn",
              "CONFIG_PACKAGE_luci-app-turboacc",
              "CONFIG_PACKAGE_luci-i18n-turboacc-zh-cn",
              "CONFIG_PACKAGE_luci-app-wrtbwmon",
              "CONFIG_PACKAGE_luci-i18n-wrtbwmon-zh-cn",
              "CONFIG_PACKAGE_wrtbwmon",
              "CONFIG_PACKAGE_luci-app-fullconenat",
              "CONFIG_PACKAGE_luci-i18n-fullconenat-zh-cn",
              "CONFIG_PACKAGE_fullconenat",
          }

          required_enable = {
              "CONFIG_CCACHE",
              "CONFIG_PACKAGE_firewall4",
              "CONFIG_PACKAGE_kmod-mediatek_hnat",
              "CONFIG_PACKAGE_kmod-nf-conntrack",
              "CONFIG_PACKAGE_kmod-nf-nat",

              # 用户确认的 dae/eBPF/BTF 内核依赖。
              "CONFIG_KERNEL_CGROUPS",
              "CONFIG_KERNEL_KPROBES",
              "CONFIG_KERNEL_KPROBE_EVENTS",
              "CONFIG_KERNEL_BPF_EVENTS",
              "CONFIG_KERNEL_BPF_STREAM_PARSER",
              "CONFIG_KERNEL_DEBUG_INFO",
              "CONFIG_KERNEL_DEBUG_INFO_BTF",
              "CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES",
              "CONFIG_KERNEL_XDP_SOCKETS",
              "CONFIG_PACKAGE_kmod-xdp-sockets-diag",
          }

          legacy_patterns = [
              re.compile(r"iptables(?:-.*)?$"),
              re.compile(r"ip6tables(?:-.*)?$"),
              re.compile(r"iptables-mod-.*$"),
              re.compile(r"kmod-ipt-.*$"),
              re.compile(r"kmod-ip6tables(?:-.*)?$"),
              re.compile(r"kmod-nf-ipt6?$"),
              re.compile(r"ipset$"),
              re.compile(r"libipset$"),
              re.compile(r"libiptext.*$"),
              re.compile(r"libxtables$"),
              re.compile(r"xtables-nft$"),
              re.compile(r"ebtables(?:-.*)?$"),
              re.compile(r"kmod-ebtables(?:-.*)?$"),
              re.compile(r"kmod-nft-compat$"),
          ]

          def is_legacy(symbol: str) -> bool:
              prefix = "CONFIG_PACKAGE_"

              if not symbol.startswith(prefix):
                  return False

              package = symbol[len(prefix):]

              return any(
                  pattern.fullmatch(package)
                  for pattern in legacy_patterns
              )

          enabled_re = re.compile(
              r"^(CONFIG_[A-Za-z0-9_-]+)=(.*)$"
          )

          disabled_re = re.compile(
              r"^# (CONFIG_[A-Za-z0-9_-]+) is not set$"
          )

          output = []
          disabled = set(exact_disable)
          removed = []

          for line in lines:
              match = enabled_re.match(line)

              if match:
                  symbol = match.group(1)

                  if symbol in exact_disable or is_legacy(symbol):
                      disabled.add(symbol)
                      removed.append(line)
                      continue

                  if symbol in required_enable:
                      continue

              match = disabled_re.match(line)

              if match:
                  symbol = match.group(1)

                  if (
                      symbol in exact_disable
                      or symbol in required_enable
                      or is_legacy(symbol)
                  ):
                      if symbol in exact_disable or is_legacy(symbol):
                          disabled.add(symbol)
                      continue

              output.append(line)

          output.append("")
          output.append("# Custom RG-X60 overrides")

          for symbol in sorted(disabled):
              output.append(
                  f"# {symbol} is not set"
              )

          for symbol in sorted(required_enable):
              output.append(
                  f"{symbol}=y"
              )

          output.append(
              "# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set"
          )

          path.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8",
          )

          print("本轮清除的已启用项目：")

          for line in removed:
              print(f"  {line}")
          PY
          }

          echo
          echo "===== 第一轮清理 ====="

          clean_config

          make defconfig \
            2>&1 | tee ../defconfig-clean-1.log

          echo
          echo "===== 第二轮清理 ====="

          clean_config

          make defconfig \
            2>&1 | tee ../defconfig-clean-2.log

          cp .config ../x60-final.config

          echo
          echo "===== 最终 legacy 配置预览 ====="

          grep -E \
            '^CONFIG_PACKAGE_(iptables|ip6tables|iptables-mod-|kmod-ipt-|kmod-ip6tables|kmod-nf-ipt|ipset|libipset|libiptext|libxtables|xtables-nft|ebtables|kmod-ebtables|kmod-nft-compat).*=(y|m)$' \
            .config || true

      - name: Verify OpenWrt configuration
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          require_y() {
            local symbol="$1"

            if grep -qx "${symbol}=y" .config; then
              echo "OK: ${symbol}=y"
            else
              echo "ERROR: ${symbol}=y 未生效"
              grep -E "^${symbol}(=| )" .config || true
              exit 1
            fi
          }

          require_disabled() {
            local symbol="$1"

            if grep -qE "^${symbol}=(y|m)$" .config; then
              echo "ERROR: ${symbol} 不应启用"
              grep -E "^${symbol}=(y|m)$" .config
              exit 1
            else
              echo "OK: ${symbol} 未启用"
            fi
          }

          echo "===== 目标设备 ====="

          mapfile -t SELECTED_TARGETS < <(
            grep -E \
              '^CONFIG_TARGET(_DEVICE)?_mediatek_filogic_DEVICE_.*=y$' \
              .config || true
          )

          printf '%s\n' "${SELECTED_TARGETS[@]:-}"

          if (( ${#SELECTED_TARGETS[@]} != 1 )); then
            echo "ERROR: 预期只选择一个 Filogic 设备，实际为 ${#SELECTED_TARGETS[@]}"
            exit 1
          fi

          if [[ "${SELECTED_TARGETS[0]}" != "${DEVICE_CONFIG}=y" ]]; then
            echo "ERROR: 目标不是普通 RG-X60"
            echo "预期：${DEVICE_CONFIG}=y"
            echo "实际：${SELECTED_TARGETS[0]}"
            exit 1
          fi

          echo "OK: 只编译普通 RG-X60"

          echo
          echo "===== HNAT / firewall4 ====="

          require_y CONFIG_PACKAGE_kmod-mediatek_hnat
          require_y CONFIG_PACKAGE_kmod-nf-conntrack
          require_y CONFIG_PACKAGE_kmod-nf-nat
          require_y CONFIG_PACKAGE_firewall4

          echo
          echo "===== eBPF / BTF ====="

          REQUIRED_BPF_OPTIONS=(
            CONFIG_KERNEL_CGROUPS
            CONFIG_KERNEL_KPROBES
            CONFIG_KERNEL_KPROBE_EVENTS
            CONFIG_KERNEL_BPF_EVENTS
            CONFIG_KERNEL_BPF_STREAM_PARSER
            CONFIG_KERNEL_DEBUG_INFO
            CONFIG_KERNEL_DEBUG_INFO_BTF
            CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES
            CONFIG_KERNEL_XDP_SOCKETS
            CONFIG_PACKAGE_kmod-xdp-sockets-diag
          )

          for option in "${REQUIRED_BPF_OPTIONS[@]}"; do
            require_y "${option}"
          done

          if ! grep -qx \
            '# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set' \
            .config
          then
            echo "ERROR: CONFIG_KERNEL_DEBUG_INFO_REDUCED 必须关闭"
            grep -E 'CONFIG_KERNEL_DEBUG_INFO_REDUCED' .config || true
            exit 1
          fi

          echo "OK: CONFIG_KERNEL_DEBUG_INFO_REDUCED 已关闭"

          echo
          echo "===== 不内置 dae ====="

          require_disabled CONFIG_PACKAGE_dae
          require_disabled CONFIG_PACKAGE_daed
          require_disabled CONFIG_PACKAGE_luci-app-daede

          echo
          echo "===== 不需要的应用 ====="

          UNWANTED_APPS=(
            CONFIG_PACKAGE_luci-app-passwall
            CONFIG_PACKAGE_luci-app-ssr-plus
            CONFIG_PACKAGE_luci-app-vssr
            CONFIG_PACKAGE_luci-app-rclone
            CONFIG_PACKAGE_luci-app-eqos
            CONFIG_PACKAGE_luci-app-eqos-mtk
            CONFIG_PACKAGE_luci-app-upnp
            CONFIG_PACKAGE_miniupnpd
            CONFIG_PACKAGE_miniupnpd-nftables
            CONFIG_PACKAGE_luci-app-turboacc-mtk
            CONFIG_PACKAGE_luci-app-wrtbwmon
            CONFIG_PACKAGE_wrtbwmon
          )

          for option in "${UNWANTED_APPS[@]}"; do
            require_disabled "${option}"
          done

          echo
          echo "===== legacy iptables/ipset/ebtables ====="

          LEGACY_REGEX='^CONFIG_PACKAGE_(iptables(-.*)?|ip6tables(-.*)?|iptables-mod-.*|kmod-ipt-.*|kmod-ip6tables(-.*)?|kmod-nf-ipt6?|ipset|libipset|libiptext.*|libxtables|xtables-nft|ebtables(-.*)?|kmod-ebtables(-.*)?|kmod-nft-compat)=(y|m)$'

          if grep -qE "${LEGACY_REGEX}" .config; then
            echo "ERROR: 依赖收敛后仍包含 legacy/compat 防火墙组件："
            grep -E "${LEGACY_REGEX}" .config
            exit 1
          fi

          echo "OK: 未检测到 legacy iptables/ipset/ebtables"

          echo
          echo "OpenWrt 配置校验通过。"

      - name: Download package sources
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          make download -j8 V=s \
            2>&1 | tee ../download-parallel.log || true

          find dl \
            -type f \
            -size -1024c \
            -print \
            -delete || true

          make download -j1 V=s \
            2>&1 | tee ../download-single.log

      - name: Prepare kernel
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          make target/linux/prepare \
            -j1 \
            V=s \
            2>&1 | tee ../kernel-prepare.log

      - name: Verify generated Linux kernel configuration
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t KERNEL_CONFIGS < <(
            find build_dir \
              -type f \
              -path '*/linux-mediatek_filogic/linux-6.6*/.config' \
              -print |
              sort
          )

          echo "找到的内核配置："
          printf '%s\n' "${KERNEL_CONFIGS[@]:-}"

          if (( ${#KERNEL_CONFIGS[@]} == 0 )); then
            echo "ERROR: 找不到 Filogic Linux 6.6 内核配置"

            find build_dir \
              -type f \
              -path '*/linux*/.config' \
              -print || true

            exit 1
          fi

          require_kernel_y() {
            local config="$1"
            local symbol="$2"

            if grep -qx "${symbol}=y" "${config}"; then
              echo "OK: ${symbol}=y"
            else
              echo "ERROR: ${config} 缺少 ${symbol}=y"
              grep -E "^${symbol}(=| )" "${config}" || true
              exit 1
            fi
          }

          REQUIRED_KERNEL_OPTIONS=(
            CONFIG_CGROUPS
            CONFIG_KPROBES
            CONFIG_KPROBE_EVENTS
            CONFIG_BPF_EVENTS
            CONFIG_BPF_STREAM_PARSER
            CONFIG_DEBUG_INFO
            CONFIG_DEBUG_INFO_BTF
            CONFIG_DEBUG_INFO_BTF_MODULES
            CONFIG_XDP_SOCKETS
          )

          for kernel_config in "${KERNEL_CONFIGS[@]}"; do
            echo
            echo "校验：${kernel_config}"

            for option in "${REQUIRED_KERNEL_OPTIONS[@]}"; do
              require_kernel_y "${kernel_config}" "${option}"
            done
          done

          cp "${KERNEL_CONFIGS[0]}" ../kernel-rg-x60.config

          echo
          echo "Linux 内核 eBPF/BTF 配置校验通过。"

      - name: Build firmware
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          if ! make -j"$(nproc)" V=s \
            2>&1 | tee ../build-parallel.log
          then
            echo "并行编译失败，使用单线程重试。"

            make -j1 V=s \
              2>&1 | tee ../build-single.log
          fi

      - name: Verify built kernel contains BTF
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t VMLINUX_FILES < <(
            find build_dir \
              -type f \
              -path '*/linux-mediatek_filogic/linux-6.6*/vmlinux' \
              -print |
              sort
          )

          echo "找到的 vmlinux："
          printf '%s\n' "${VMLINUX_FILES[@]:-}"

          if (( ${#VMLINUX_FILES[@]} == 0 )); then
            echo "ERROR: 找不到 Filogic vmlinux"
            exit 1
          fi

          for vmlinux in "${VMLINUX_FILES[@]}"; do
            if ! readelf --sections --wide "${vmlinux}" |
              grep -qE '[[:space:]]\.BTF[[:space:]]'
            then
              echo "ERROR: ${vmlinux} 中没有 .BTF section"
              exit 1
            fi

            echo "OK: ${vmlinux} 包含 .BTF section"
          done

      - name: Collect and verify firmware
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -d "${OUTPUT_DIR}" || {
            echo "ERROR: 找不到 ${OUTPUT_DIR}"
            exit 1
          }

          mapfile -t IMAGES < <(
            find "${OUTPUT_DIR}" \
              -maxdepth 1 \
              -type f \
              -name "*${DEVICE_NAME}*squashfs-sysupgrade.bin" \
              -print
          )

          echo "找到的 RG-X60 固件："
          printf '%s\n' "${IMAGES[@]:-}"

          if (( ${#IMAGES[@]} != 1 )); then
            echo "ERROR: 预期恰好生成一个普通 RG-X60 sysupgrade.bin，实际为 ${#IMAGES[@]}"

            find "${OUTPUT_DIR}" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' |
              sort

            exit 1
          fi

          mkdir -p ../firmware

          FINAL_IMAGE="../firmware/RG-X60-${BUILD_DATE}-${SOURCE_SHORT_SHA}-sysupgrade.bin"

          cp "${IMAGES[0]}" "${FINAL_IMAGE}"
          cp ../x60-final.config ../firmware/
          cp ../kernel-rg-x60.config ../firmware/

          if [[ -f "${OUTPUT_DIR}/profiles.json" ]]; then
            cp "${OUTPUT_DIR}/profiles.json" ../firmware/
          fi

          if [[ -f "${OUTPUT_DIR}/sha256sums" ]]; then
            cp "${OUTPUT_DIR}/sha256sums" \
              ../firmware/upstream-sha256sums
          fi

          (
            cd ../firmware
            sha256sum *.bin > SHA256SUMS
          )

          echo "最终产物："
          ls -lh ../firmware

      - name: Show ccache statistics
        if: always()
        shell: bash
        run: |
          ccache --show-stats || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RG-X60-${{ env.BUILD_ID }}-${{ env.SOURCE_SHORT_SHA }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RG-X60-failure-logs-${{ github.run_number }}
          path: |
            *.log
            x60-final.config
            kernel-rg-x60.config
            openwrt/.config
            openwrt/logs/
          if-no-files-found: ignore
          retention-days: 7
