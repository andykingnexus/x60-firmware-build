name: Build RG-X60

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/RuijieNetworksCommunity/MT798X-6.6-24.10
  OPENWRT_BRANCH: openwrt-24.10-6.6
  DEVICE_NAME: ruijie-rg-x60
  CONFIG_FILE: defconfig/x60.config

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout build files
        uses: actions/checkout@v4


      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt clean


      - name: Install build dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl


      - name: Cache OpenWrt build data
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
            openwrt/build_dir
          key: openwrt-rg-x60-${{ hashFiles('defconfig/x60.config') }}
          restore-keys: |
            openwrt-rg-x60-


      - name: Clone OpenWrt source
        run: |
          git clone \
            --depth=1 \
            -b "${OPENWRT_BRANCH}" \
            "${OPENWRT_REPO}" \
            openwrt


      - name: Apply HNAT NF_NAT patch
        run: |

          cd openwrt

          PATCH=$(grep -rl \
            "depends on NET_MEDIATEK_SOC.*NF_CONNTRACK.*IP_NF_NAT" \
            target/linux/mediatek/patches-* \
            || true)

          if [ -z "$PATCH" ]; then
              echo "HNAT legacy dependency not found"
              exit 0
          fi

          echo "Found patch:"
          echo "$PATCH"

          sed -i \
          's/depends on NET_MEDIATEK_SOC.*NF_CONNTRACK.*IP_NF_NAT/depends on NET_MEDIATEK_SOC \&\& NF_CONNTRACK/' \
          "$PATCH"

          echo "HNAT dependency fixed"


      - name: Update and install feeds
        run: |
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a


      - name: Apply x60 config
        run: |

          cd openwrt

          cp ../${CONFIG_FILE} .config

          make defconfig


      - name: Check important configuration
        run: |

          cd openwrt

          echo "===== Target ====="

          grep \
          "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_ruijie-rg-x60" \
          .config || true


          echo

          echo "===== eBPF/BTF ====="

          grep -E \
          "CONFIG_KERNEL_(DEBUG_INFO|DEBUG_INFO_BTF|BPF_EVENTS|CGROUP_BPF|XDP_SOCKETS)" \
          .config || true


          echo

          echo "===== dae ====="

          grep -E \
          "CONFIG_PACKAGE_(dae|daed)" \
          .config || true


      - name: Download package sources
        run: |

          cd openwrt

          make download \
            -j8 \
            V=s


      - name: Build firmware
        run: |

          cd openwrt

          echo "===== Build start ====="

          make \
            -j$(nproc) \
            V=s


      - name: Collect firmware
        run: |

          mkdir -p output

          cp -av \
          openwrt/bin/targets/mediatek/filogic/* \
          output/


      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: RG-X60-firmware
          path: output/


      - name: Generate release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rg-x60-${{ github.run_number }}
          name: RG-X60 build ${{ github.run_number }}
          files: |
            output/*
