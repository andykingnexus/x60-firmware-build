name: Build Ruijie RG-X60 Firmware

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Clean build cache"
        required: false
        default: false
        type: boolean

env:
  OPENWRT_REPO: https://github.com/RuijieNetworksCommunity/MT798X-6.6-24.10
  OPENWRT_BRANCH: openwrt-24.10-6.6

  OPENWRT_DIR: openwrt

  DEVICE_NAME: ruijie-rg-x60

  TZ: Asia/Shanghai


jobs:

  build:

    runs-on: ubuntu-24.04

    timeout-minutes: 360


    steps:


    #################################################
    # Checkout build repository
    #################################################

    - name: Checkout build files
      uses: actions/checkout@v4



    #################################################
    # Free disk
    #################################################

    - name: Free disk space

      run: |

        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc

        sudo docker system prune -af || true

        df -h



    #################################################
    # Dependencies
    #################################################

    - name: Install dependencies

      env:
        DEBIAN_FRONTEND: noninteractive

      run: |

        sudo apt update


        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          gawk \
          gcc-multilib \
          g++-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-pip \
          python3-pyelftools \
          rsync \
          unzip \
          wget \
          zlib1g-dev \
          file \
          ccache \
          device-tree-compilter \
          patch \
          bc \
          jq \
          xz-utils \
          zstd


        sudo timedatectl set-timezone "${TZ}"



    #################################################
    # Clone OpenWrt source
    #################################################

    - name: Clone Ruijie OpenWrt source

      run: |

        git clone \
          --depth=1 \
          --branch "${OPENWRT_BRANCH}" \
          "${OPENWRT_REPO}" \
          "${OPENWRT_DIR}"


        cd "${OPENWRT_DIR}"


        echo "Commit:"
        git rev-parse HEAD




    #################################################
    # Apply HNAT patch
    #################################################

    - name: Apply HNAT NF_NAT patch

      run: |

        chmod +x scripts/apply-hnat-patch.sh


        ./scripts/apply-hnat-patch.sh




    #################################################
    # Feeds
    #################################################

    - name: Update feeds

      working-directory: openwrt

      run: |

        ./scripts/feeds update -a

        ./scripts/feeds install -a




    #################################################
    # Apply config
    #################################################

    - name: Apply RG-X60 config

      working-directory: openwrt

      run: |

        cp \
          ../defconfig/x60.config \
          .config


        make defconfig


        cp .config ../x60-final.config




    #################################################
    # Verify OpenWrt config
    #################################################

    - name: Verify OpenWrt config

      run: |

        chmod +x scripts/verify-config.sh


        ./scripts/verify-config.sh \
          openwrt/.config




    #################################################
    # Prepare kernel
    #################################################

    - name: Prepare kernel source

      working-directory: openwrt

      run: |

        make target/linux/prepare V=s




    #################################################
    # Verify kernel BPF/BTF
    #################################################

    - name: Verify kernel BPF BTF

      run: |

        chmod +x scripts/verify-kernel-bpf.sh


        ./scripts/verify-kernel-bpf.sh openwrt




    #################################################
    # ccache
    #################################################

    - name: Restore ccache

      if: ${{ github.event.inputs.clean_build != 'true' }}

      uses: actions/cache@v4

      with:

        path: ~/.ccache

        key: rg-x60-${{ runner.os }}-${{ hashFiles('defconfig/x60.config') }}

        restore-keys:

          rg-x60-${{ runner.os }}-




    - name: Configure ccache

      run: |

        mkdir -p ~/.ccache


        ccache \
          --set-config=max_size=8G


        ccache \
          --set-config=compression=true


        ccache -z




    #################################################
    # Download
    #################################################

    - name: Download packages

      working-directory: openwrt

      run: |

        set -o pipefail


        make download \
          -j8 \
          V=s \
          2>&1 | tee ../download-parallel.log || true


        find dl \
          -type f \
          -size -1024c \
          -delete


        make download \
          -j1 \
          V=s \
          2>&1 | tee ../download-single.log




    #################################################
    # Build
    #################################################

    - name: Compile firmware

      working-directory: openwrt

      run: |

        set -o pipefail


        make \
          -j$(nproc) \
          V=s \
          2>&1 | tee ../build.log




    #################################################
    # Check image
    #################################################

    - name: Check firmware output

      working-directory: openwrt

      run: |

        set -euo pipefail


        mkdir -p ../firmware



        mapfile -t images < <(

          find \
          bin/targets/mediatek/filogic \
          -maxdepth 1 \
          -type f \
          -name "*${DEVICE_NAME}*sysupgrade.bin"

        )



        echo "Found images:"

        printf '%s\n' "${images[@]}"



        if [ "${#images[@]}" -ne 1 ]

        then

          echo "ERROR: Expected exactly one sysupgrade image"

          exit 1

        fi



        cp \
          "${images[0]}" \
          ../firmware/


        cp \
          .config \
          ../firmware/x60-final.config



        sha256sum \
          ../firmware/*.bin \
          > ../firmware/SHA256SUMS




    #################################################
    # Upload
    #################################################

    - name: Upload firmware

      uses: actions/upload-artifact@v4

      with:

        name: RG-X60-firmware

        path: firmware/

        retention-days: 30




    #################################################
    # Failure logs
    #################################################

    - name: Upload failure logs

      if: failure()

      uses: actions/upload-artifact@v4

      with:

        name: RG-X60-build-failure-logs

        path: |

          build.log

          download-parallel.log

          download-single.log

          x60-final.config

          openwrt/.config

        retention-days: 7
