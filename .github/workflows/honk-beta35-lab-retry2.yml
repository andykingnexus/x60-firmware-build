name: honk beta35 gateway lab retry2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/honk-beta35-lab-retry2.yml'

permissions:
  contents: read

concurrency:
  group: honk-beta35-lab-retry2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      HONK_REF: v0.0.1.beta.35
      REPORT_DIR: /tmp/honk-lab-results
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout harness repository
        uses: actions/checkout@v4

      - name: Prepare and install dependencies
        run: |
          set -euxo pipefail
          sudo mkdir -p "$REPORT_DIR" /etc/dae
          sudo chown -R "$USER:$USER" "$REPORT_DIR"
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang llvm libbpf-dev libelf-dev zlib1g-dev \
            cmake libclang-dev pkg-config iproute2 iputils-ping nftables \
            jq curl unzip openssl python3 python3-pip python3-yaml netcat-openbsd \
            iperf3 socat git
          sudo tee /usr/local/bin/bpftool >/dev/null <<'SH'
          #!/bin/sh
          for candidate in /usr/lib/linux-tools/*/bpftool /usr/sbin/bpftool.real; do
            if [ -x "$candidate" ]; then exec "$candidate" "$@"; fi
          done
          echo 'bpftool unavailable on this hosted runner; tc/eBPF attach evidence is collected separately'
          exit 0
          SH
          sudo chmod +x /usr/local/bin/bpftool

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools

      - name: Execute complete lab plan
        id: lab_runner
        continue-on-error: true
        run: |
          cat > /tmp/run_honk_lab.py <<'PY'
          import json, os, pathlib, subprocess, sys, yaml
          data = yaml.safe_load(pathlib.Path('.github/workflows/honk-beta35-lab.yml').read_text())
          steps = data['jobs']['lab']['steps']
          skip = {
              'Checkout harness repository', 'Install host dependencies',
              'Install Rust toolchains', 'Install Rust nightly for eBPF',
              'Write overall result summary', 'Upload all evidence'
          }
          outcomes = {}
          report = pathlib.Path(os.environ['REPORT_DIR'])
          report.mkdir(parents=True, exist_ok=True)
          for step in steps:
              name, script = step.get('name', '<unnamed>'), step.get('run')
              if name in skip or not script:
                  continue
              print(f'\n===== {name} =====', flush=True)
              result = subprocess.run(['bash', '-eo', 'pipefail', '-c', script], env=os.environ.copy())
              outcomes[name] = {'outcome': 'success' if result.returncode == 0 else 'failure', 'returncode': result.returncode}
              (report / 'step-outcomes.json').write_text(json.dumps(outcomes, indent=2))
              if result.returncode:
                  print(f'STEP FAILED: {name}; continuing to collect independent evidence', file=sys.stderr)
          print(json.dumps(outcomes, indent=2))
          sys.exit(1 if any(v['returncode'] for v in outcomes.values()) else 0)
          PY
          python3 /tmp/run_honk_lab.py 2>&1 | tee "$REPORT_DIR/retry2-runner.log"

      - name: Write summary
        if: always()
        run: |
          {
            echo '# honk v0.0.1.beta.35 validation summary'
            echo
            echo "- Lab runner outcome: ${{ steps.lab_runner.outcome }}"
            [ ! -f "$REPORT_DIR/step-outcomes.json" ] || { echo '```json'; cat "$REPORT_DIR/step-outcomes.json"; echo '```'; }
            [ ! -f "$REPORT_DIR/gateway-summary.json" ] || { echo '## Gateway smoke'; echo '```json'; cat "$REPORT_DIR/gateway-summary.json"; echo '```'; }
          } | tee "$REPORT_DIR/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honk-beta35-lab-results-retry2
          path: /tmp/honk-lab-results
          if-no-files-found: error
          retention-days: 7
