name: honk beta35 exact-source gateway validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/honk-beta35-lab-retry2.yml'

permissions:
  contents: read

concurrency:
  group: honk-beta35-exact-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REPORT_DIR: /tmp/honk-exact-results
      HONK_REF: v0.0.1.beta.35
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install build and network dependencies
        run: |
          set -euxo pipefail
          sudo mkdir -p "$REPORT_DIR" /sys/fs/bpf
          sudo chown -R "$USER:$USER" "$REPORT_DIR"
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm libbpf-dev libelf-dev zlib1g-dev cmake libclang-dev pkg-config iproute2 iptables nftables curl python3 git

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools

      - name: Build exact beta35 source with embedded eBPF
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --branch "$HONK_REF" --depth 1 https://github.com/Glassyiris/honk.git /tmp/honk
          cd /tmp/honk
          git describe --tags --exact-match | tee "$REPORT_DIR/source-tag.txt"
          git rev-parse HEAD | tee "$REPORT_DIR/source-commit.txt"
          cargo install bpf-linker --locked
          sed -i 's|linker=/root/.cargo/bin/bpf-linker-wrapper|linker=bpf-linker|' crates/honk-ebpf/.cargo/config.toml
          cd crates/honk-ebpf
          cargo +nightly build --release -Zbuild-std=core --target bpfel-unknown-none
          readelf -S target/bpfel-unknown-none/release/honk-ebpf | tee "$REPORT_DIR/ebpf-sections.txt"
          grep -q '\.BTF' "$REPORT_DIR/ebpf-sections.txt"
          cd /tmp/honk
          cargo +stable build --release -p honk-core --features ebpf
          ./target/release/honk-core --version | tee "$REPORT_DIR/core-version.txt"
          sha256sum ./target/release/honk-core | tee "$REPORT_DIR/core.sha256"
          mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf

      - name: Exercise routed datapath reload and WAN recreation
        run: |
          set -euxo pipefail
          cat > /tmp/exact_gateway.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          R=/tmp/honk-exact-results
          HONK=/tmp/honk/target/release/honk-core
          HPID=''; SPID=''
          cleanup() {
            [ -z "$HPID" ] || kill "$HPID" 2>/dev/null || true
            [ -z "$SPID" ] || kill "$SPID" 2>/dev/null || true
            pkill -f '^python3 /tmp/exact_servers.py$' 2>/dev/null || true
            iptables -D FORWARD -i br-lan -o pppoe-wan -j ACCEPT 2>/dev/null || true
            iptables -D FORWARD -i pppoe-wan -o br-lan -j ACCEPT 2>/dev/null || true
            ip link del br-lan 2>/dev/null || true
            ip link del pppoe-wan 2>/dev/null || true
            for i in ra0 rax0 lan3; do ip link del "$i" 2>/dev/null || true; done
            ip netns del client 2>/dev/null || true
            ip netns del wan 2>/dev/null || true
            ip netns del daens 2>/dev/null || true
            ip link del dae0 2>/dev/null || true
            ip rule del fwmark 0x8000000/0x8000000 table 100 2>/dev/null || true
            ip route flush table 100 2>/dev/null || true
          }
          trap 'rc=$?; cleanup; exit $rc' EXIT
          cleanup

          cat > /tmp/exact_servers.py <<'PY'
          import socket, socketserver, threading, time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          def dns(q):
              p=12
              while p<len(q) and q[p]: p += q[p]+1
              if p+5>len(q): return b''
              return q[:2]+b'\x81\x80\x00\x01\x00\x01\x00\x00\x00\x00'+q[12:p+5]+b'\xc0\x0c\x00\x01\x00\x01\x00\x00\x00\x3c\x00\x04\xcb\x00\x71\x09'
          class H(BaseHTTPRequestHandler):
              def do_HEAD(self): self.send_response(204); self.end_headers()
              def do_GET(self):
                  if self.path=='/large':
                      n=8*1024*1024; self.send_response(200); self.send_header('Content-Length',str(n)); self.end_headers(); c=b'x'*65536
                      for _ in range(n//len(c)): self.wfile.write(c); self.wfile.flush(); time.sleep(.01)
                  else:
                      b=b'EXACT-HONK-OK\n'; self.send_response(200); self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
              def log_message(self,*a): pass
          class T(socketserver.BaseRequestHandler):
              def handle(self):
                  h=self.request.recv(2)
                  if len(h)!=2:return
                  n=int.from_bytes(h,'big'); q=b''
                  while len(q)<n:
                      b=self.request.recv(n-len(q))
                      if not b:return
                      q+=b
                  r=dns(q); self.request.sendall(len(r).to_bytes(2,'big')+r)
          class TS(socketserver.ThreadingTCPServer): allow_reuse_address=True
          def udpdns():
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.bind(('10.0.0.2',5300))
              while 1:
                  q,a=s.recvfrom(4096); r=dns(q)
                  if r:s.sendto(r,a)
          def echo():
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.bind(('10.0.0.2',18081))
              while 1:
                  d,a=s.recvfrom(65535); s.sendto(d,a)
          threading.Thread(target=udpdns,daemon=True).start(); threading.Thread(target=echo,daemon=True).start()
          t=TS(('10.0.0.2',5300),T); threading.Thread(target=t.serve_forever,daemon=True).start()
          ThreadingHTTPServer(('10.0.0.2',18080),H).serve_forever()
          PY

          wan_up() {
            ip netns add wan
            ip link add pppoe-wan type veth peer name wan0
            ip link set wan0 netns wan
            ip addr add 10.0.0.1/24 dev pppoe-wan; ip link set pppoe-wan up
            ip netns exec wan ip addr add 10.0.0.2/24 dev wan0; ip netns exec wan ip link set lo up; ip netns exec wan ip link set wan0 up
            ip netns exec wan ip route add 192.168.10.0/24 via 10.0.0.1
            ip netns exec wan python3 /tmp/exact_servers.py > "$R/servers.log" 2>&1 & SPID=$!
            for _ in $(seq 1 30); do ip netns exec wan curl -fsS --max-time 1 http://10.0.0.2:18080/ >/dev/null 2>&1 && return 0; sleep .2; done
            return 1
          }
          ip netns add client
          ip link add br-lan type bridge; ip addr add 192.168.10.1/24 dev br-lan; ip link set br-lan up
          ip link add lan2 type veth peer name client0; ip link set client0 netns client; ip link set lan2 master br-lan; ip link set lan2 up
          for i in ra0 rax0 lan3; do ip link add "$i" type dummy; ip link set "$i" master br-lan; ip link set "$i" up; done
          ip netns exec client ip addr add 192.168.10.150/24 dev client0; ip netns exec client ip link set lo up; ip netns exec client ip link set client0 up; ip netns exec client ip route add default via 192.168.10.1
          wan_up
          sysctl -w net.ipv4.ip_forward=1; sysctl -w net.ipv4.conf.all.rp_filter=0; sysctl -w net.ipv4.conf.br-lan.rp_filter=0; sysctl -w net.ipv4.conf.pppoe-wan.rp_filter=0
          iptables -I FORWARD 1 -i br-lan -o pppoe-wan -j ACCEPT; iptables -I FORWARD 1 -i pppoe-wan -o br-lan -j ACCEPT
          tcp(){ ip netns exec client curl -fsS --max-time 5 http://10.0.0.2:18080/|grep -q EXACT-HONK-OK; }
          udp(){ ip netns exec client python3 -c "import socket;s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(3);s.sendto(b'x',('10.0.0.2',18081));assert s.recvfrom(10)[0]==b'x'"; }
          tcp; udp; echo ok > "$R/baseline.txt"

          cat > /tmp/exact.dae <<'DAE'
          global {
              tproxy_port: 12345
              lan_interface: br-lan
              wan_interface: pppoe-wan
              log_level: info
              allow_insecure: true
              auto_config_kernel_parameter: true
              so_mark_from_dae: 0
              sniffing_timeout: 30ms
              dial_mode: domain
              tcp_check_url: 'http://10.0.0.2:18080'
              udp_check_dns: '10.0.0.2:5300'
              check_interval: 3600s
              bootstrap_resolver: '10.0.0.2:5300'
          }
          dns {
              ipversion_prefer: 4
              upstream {
                  local: 'udp://10.0.0.2:5300'
              }
              routing {
                  request {
                      fallback: local
                  }
              }
          }
          routing {
              dip(10.0.0.0/24) -> direct(must)
              fallback: direct
          }
          experimental {
              clash_api {
                  external_controller: '127.0.0.1:19090'
                  default_mode: 'Rule'
              }
              cache_file {
                  enabled: true
                  path: '/tmp/exact-cache.db'
                  store_dns: true
              }
          }
          DAE
          "$HONK" --config /tmp/exact.dae > "$R/honk.log" 2>&1 & HPID=$!
          for _ in $(seq 1 80); do grep -q 'honk-core is running' "$R/honk.log" && break; kill -0 "$HPID"; sleep .25; done
          grep -q 'honk-core is running' "$R/honk.log"
          curl -fsS --max-time 3 http://127.0.0.1:19090/version > "$R/version.json"
          sleep 6; grep -q "Node 'direct' is alive after TCP health check" "$R/honk.log"; ! grep -q "Node 'direct' failed TCP health check" "$R/honk.log"
          tcp; udp
          ip netns exec client python3 -c "import socket;q=b'\x12\x34\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x03www\x07example\x03com\x00\x00\x01\x00\x01';s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(3);s.sendto(q,('10.0.0.2',53));d=s.recvfrom(2048)[0];assert d[:2]==b'\x12\x34' and d.endswith(b'\xcb\x00\x71\x09')"
          R0=$(awk '/VmRSS/{print $2}' /proc/$HPID/status); F0=$(find /proc/$HPID/fd -maxdepth 1 -type l|wc -l)
          ip netns exec client curl -fsS --max-time 20 http://10.0.0.2:18080/large -o /tmp/large & L=$!
          for _ in $(seq 1 10); do kill -HUP "$HPID"; sleep .18; tcp; done
          wait "$L"; test "$(stat -c %s /tmp/large)" = 8388608
          ip netns exec client python3 - <<'PY' > "$R/tcp.json"
          import concurrent.futures,json,socket
          def f(_):
              s=socket.create_connection(('10.0.0.2',18080),3);s.sendall(b'GET / HTTP/1.1\r\nHost:x\r\nConnection:close\r\n\r\n');d=b''
              while 1:
                  b=s.recv(4096)
                  if not b:break
                  d+=b
              return b'EXACT-HONK-OK' in d
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as e:r=list(e.map(f,range(64)))
          print(json.dumps({'attempted':64,'successful':sum(r)}));assert sum(r)==64
          PY
          ip netns exec client python3 - <<'PY' > "$R/udp.json"
          import json,socket
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(2);ok=0
          for i in range(128):
              p=i.to_bytes(4,'big');s.sendto(p,('10.0.0.2',18081));ok+=s.recvfrom(20)[0]==p
          print(json.dumps({'attempted':128,'successful':ok}));assert ok==128
          PY
          R1=$(awk '/VmRSS/{print $2}' /proc/$HPID/status); F1=$(find /proc/$HPID/fd -maxdepth 1 -type l|wc -l)
          kill "$SPID" 2>/dev/null||true;SPID='';ip link del pppoe-wan;ip netns del wan;sleep 2;wan_up
          for _ in $(seq 1 50);do grep -q 'attached eBPF programs to new interface.*pppoe-wan' "$R/honk.log"&&break;sleep .2;done
          grep -q 'attached eBPF programs to new interface.*pppoe-wan' "$R/honk.log";tcp;udp
          R2=$(awk '/VmRSS/{print $2}' /proc/$HPID/status); F2=$(find /proc/$HPID/fd -maxdepth 1 -type l|wc -l)
          cat > "$R/result.json" <<JSON
          {"baseline":true,"tcp":true,"udp":true,"dns":true,"health":true,"reloads":10,"stream_bytes":8388608,"parallel_tcp":64,"udp_roundtrips":128,"wan_recreate":true,"rss_kb":[$R0,$R1,$R2],"fd":[$F0,$F1,$F2]}
          JSON
          cat "$R/result.json"
          SH
          chmod +x /tmp/exact_gateway.sh
          set -o pipefail
          sudo -E /tmp/exact_gateway.sh 2>&1 | tee "$REPORT_DIR/run.log"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honk-beta35-exact-results
          path: /tmp/honk-exact-results
          if-no-files-found: error
          retention-days: 7
