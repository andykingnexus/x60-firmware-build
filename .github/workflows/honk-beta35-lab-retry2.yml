name: honk beta35 gateway baseline validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/honk-beta35-lab-retry2.yml'

permissions:
  contents: read

concurrency:
  group: honk-beta35-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPORT_DIR: /tmp/honk-baseline-results
      HONK_REF: v0.0.1.beta.35
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Install runtime dependencies and exact release
        run: |
          set -euxo pipefail
          sudo mkdir -p "$REPORT_DIR" /sys/fs/bpf
          sudo chown -R "$USER:$USER" "$REPORT_DIR"
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables nftables curl python3 jq tar
          curl -fsSL --retry 4 -o /tmp/honk.tar.gz \
            "https://github.com/Glassyiris/honk/releases/download/${HONK_REF}/honk-core-${HONK_REF}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p /tmp/honk-release
          tar -xzf /tmp/honk.tar.gz -C /tmp/honk-release --strip-components=1
          /tmp/honk-release/honk-core --version | tee "$REPORT_DIR/core-version.txt"
          sha256sum /tmp/honk.tar.gz /tmp/honk-release/honk-core | tee "$REPORT_DIR/release.sha256"
          mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf

      - name: Run baseline and honk datapath validation
        run: |
          cat > /tmp/run_gateway_baseline.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          REPORT_DIR=/tmp/honk-baseline-results
          HONK=/tmp/honk-release/honk-core
          HPID=''
          SPID=''

          cleanup_resources() {
            [ -z "$HPID" ] || kill "$HPID" 2>/dev/null || true
            [ -z "$SPID" ] || kill "$SPID" 2>/dev/null || true
            pkill -f '^python3 /tmp/baseline_servers.py$' 2>/dev/null || true
            iptables -D FORWARD -i br-lan -o pppoe-wan -j ACCEPT 2>/dev/null || true
            iptables -D FORWARD -i pppoe-wan -o br-lan -j ACCEPT 2>/dev/null || true
            ip link del br-lan 2>/dev/null || true
            ip link del pppoe-wan 2>/dev/null || true
            for i in ra0 rax0 lan3; do ip link del "$i" 2>/dev/null || true; done
            ip netns del client 2>/dev/null || true
            ip netns del wan 2>/dev/null || true
            ip netns del daens 2>/dev/null || true
            ip link del dae0 2>/dev/null || true
            ip rule del fwmark 0x8000000/0x8000000 table 100 2>/dev/null || true
            ip route flush table 100 2>/dev/null || true
          }
          trap 'rc=$?; cleanup_resources; exit $rc' EXIT
          cleanup_resources

          cat > /tmp/baseline_servers.py <<'PY'
          import socket, socketserver, threading, time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          def answer(q):
              if len(q) < 17: return b''
              p=12
              while p < len(q) and q[p] != 0:
                  n=q[p]
                  if not n or p+n >= len(q): return b''
                  p += n+1
              if p+5 > len(q): return b''
              question=q[12:p+5]
              return q[:2]+b'\x81\x80\x00\x01\x00\x01\x00\x00\x00\x00'+question+b'\xc0\x0c\x00\x01\x00\x01\x00\x00\x00\x3c\x00\x04\xcb\x00\x71\x09'

          class H(BaseHTTPRequestHandler):
              def do_HEAD(self):
                  self.send_response(204); self.end_headers()
              def do_GET(self):
                  if self.path == '/large':
                      size=16*1024*1024
                      self.send_response(200); self.send_header('Content-Length',str(size)); self.end_headers()
                      chunk=b'x'*65536
                      for _ in range(size//len(chunk)):
                          self.wfile.write(chunk); self.wfile.flush(); time.sleep(.006)
                  else:
                      body=b'BASELINE-HONK-OK\n'
                      self.send_response(200); self.send_header('Content-Length',str(len(body))); self.end_headers(); self.wfile.write(body)
              def log_message(self,*args): pass

          class T(socketserver.BaseRequestHandler):
              def handle(self):
                  h=self.request.recv(2)
                  if len(h)!=2: return
                  n=int.from_bytes(h,'big'); q=b''
                  while len(q)<n:
                      b=self.request.recv(n-len(q))
                      if not b: return
                      q+=b
                  r=answer(q); self.request.sendall(len(r).to_bytes(2,'big')+r)
          class TS(socketserver.ThreadingTCPServer): allow_reuse_address=True

          def udp_dns():
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.bind(('10.0.0.2',5300))
              while True:
                  q,a=s.recvfrom(4096); r=answer(q)
                  if r: s.sendto(r,a)
          def udp_echo():
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.bind(('10.0.0.2',18081))
              while True:
                  d,a=s.recvfrom(65535); s.sendto(d,a)

          threading.Thread(target=udp_dns,daemon=True).start()
          threading.Thread(target=udp_echo,daemon=True).start()
          td=TS(('10.0.0.2',5300),T); threading.Thread(target=td.serve_forever,daemon=True).start()
          ThreadingHTTPServer(('10.0.0.2',18080),H).serve_forever()
          PY

          setup_wan() {
            ip netns add wan
            ip link add pppoe-wan type veth peer name wan0
            ip link set wan0 netns wan
            ip addr add 10.0.0.1/24 dev pppoe-wan
            ip link set pppoe-wan up
            ip netns exec wan ip addr add 10.0.0.2/24 dev wan0
            ip netns exec wan ip link set lo up
            ip netns exec wan ip link set wan0 up
            ip netns exec wan ip route add 192.168.10.0/24 via 10.0.0.1
            ip netns exec wan python3 /tmp/baseline_servers.py > "$REPORT_DIR/servers.log" 2>&1 &
            SPID=$!
            for _ in $(seq 1 30); do
              ip netns exec wan curl -fsS --max-time 1 http://10.0.0.2:18080/ >/dev/null 2>&1 && return
              sleep .2
            done
            return 1
          }

          ip netns add client
          ip link add br-lan type bridge
          ip addr add 192.168.10.1/24 dev br-lan
          ip link set br-lan up
          ip link add lan2 type veth peer name client0
          ip link set client0 netns client
          ip link set lan2 master br-lan
          ip link set lan2 up
          for i in ra0 rax0 lan3; do ip link add "$i" type dummy; ip link set "$i" master br-lan; ip link set "$i" up; done
          ip netns exec client ip addr add 192.168.10.150/24 dev client0
          ip netns exec client ip link set lo up
          ip netns exec client ip link set client0 up
          ip netns exec client ip route add default via 192.168.10.1
          setup_wan

          sysctl -w net.ipv4.ip_forward=1
          sysctl -w net.ipv4.conf.all.rp_filter=0
          sysctl -w net.ipv4.conf.br-lan.rp_filter=0
          sysctl -w net.ipv4.conf.pppoe-wan.rp_filter=0
          iptables -I FORWARD 1 -i br-lan -o pppoe-wan -j ACCEPT
          iptables -I FORWARD 1 -i pppoe-wan -o br-lan -j ACCEPT
          iptables -S FORWARD > "$REPORT_DIR/forward-rules.txt"

          tcp_test() { ip netns exec client curl -fsS --max-time 5 http://10.0.0.2:18080/ | grep -q BASELINE-HONK-OK; }
          udp_test() {
            ip netns exec client python3 - <<'PY'
          import socket
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(3)
          s.sendto(b'echo-check',('10.0.0.2',18081)); d,_=s.recvfrom(1024); assert d==b'echo-check'
          PY
          }

          # Establish that the synthetic routed topology works before honk.
          tcp_test
          udp_test
          echo baseline-ok | tee "$REPORT_DIR/baseline.txt"

          cat > /tmp/honk-baseline.dae <<'DAE'
          global {
              tproxy_port: 12345
              lan_interface: br-lan
              wan_interface: pppoe-wan
              log_level: info
              allow_insecure: true
              auto_config_kernel_parameter: true
              so_mark_from_dae: 0
              sniffing_timeout: 30ms
              dial_mode: domain
              tcp_check_url: 'http://10.0.0.2:18080'
              udp_check_dns: '10.0.0.2:5300'
              check_interval: 3600s
              bootstrap_resolver: '10.0.0.2:5300'
          }
          dns {
              ipversion_prefer: 4
              upstream { local: 'udp://10.0.0.2:5300' }
              routing { request { fallback: local } }
          }
          routing {
              dip(10.0.0.0/24) -> direct(must)
              fallback: direct
          }
          experimental {
              clash_api { external_controller: '127.0.0.1:19090' default_mode: 'Rule' }
              cache_file { enabled: true path: '/tmp/honk-baseline-cache.db' store_dns: true }
          }
          DAE

          "$HONK" --config /tmp/honk-baseline.dae > "$REPORT_DIR/honk.log" 2>&1 & HPID=$!
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:19090/version >/dev/null 2>&1 && break
            kill -0 "$HPID"; sleep .25
          done
          curl -fsS http://127.0.0.1:19090/version | tee "$REPORT_DIR/version.json"
          sleep 6
          grep -q "Node 'direct' is alive after TCP health check" "$REPORT_DIR/honk.log"
          ! grep -q "Node 'direct' failed TCP health check" "$REPORT_DIR/honk.log"

          tcp_test
          udp_test
          ip netns exec client python3 - <<'PY'
          import socket
          q=b'\x12\x34\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x03www\x07example\x03com\x00\x00\x01\x00\x01'
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(3); s.sendto(q,('10.0.0.2',53)); d,_=s.recvfrom(2048)
          assert d[:2]==b'\x12\x34' and d.endswith(b'\xcb\x00\x71\x09')
          PY

          RSS0=$(awk '/VmRSS/{print $2}' /proc/$HPID/status); FD0=$(find /proc/$HPID/fd -maxdepth 1 -type l | wc -l)
          ip netns exec client curl -fsS --max-time 20 http://10.0.0.2:18080/large -o /tmp/large.bin & LPID=$!
          for _ in $(seq 1 10); do kill -HUP "$HPID"; sleep .18; tcp_test; done
          wait "$LPID"; test "$(stat -c %s /tmp/large.bin)" = 16777216

          ip netns exec client python3 - <<'PY' | tee "$REPORT_DIR/tcp-load.json"
          import concurrent.futures,json,socket
          def one(_):
              s=socket.create_connection(('10.0.0.2',18080),3); s.sendall(b'GET / HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r\n'); d=b''
              while True:
                  b=s.recv(4096)
                  if not b: break
                  d+=b
              s.close(); return b'BASELINE-HONK-OK' in d
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as e: r=list(e.map(one,range(100)))
          print(json.dumps({'attempted':100,'successful':sum(r)})); assert sum(r)==100
          PY
          ip netns exec client python3 - <<'PY' | tee "$REPORT_DIR/udp-load.json"
          import json,socket
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); ok=0
          for i in range(200):
              p=i.to_bytes(4,'big'); s.sendto(p,('10.0.0.2',18081)); d,_=s.recvfrom(1024); ok += d==p
          print(json.dumps({'attempted':200,'successful':ok})); assert ok==200
          PY
          RSS1=$(awk '/VmRSS/{print $2}' /proc/$HPID/status); FD1=$(find /proc/$HPID/fd -maxdepth 1 -type l | wc -l)

          kill "$SPID" 2>/dev/null || true; SPID=''; ip link del pppoe-wan; ip netns del wan; sleep 2; setup_wan
          for _ in $(seq 1 50); do grep -q 'attached eBPF programs to new interface.*pppoe-wan' "$REPORT_DIR/honk.log" && break; sleep .2; done
          grep -q 'attached eBPF programs to new interface.*pppoe-wan' "$REPORT_DIR/honk.log"
          tcp_test; udp_test
          RSS2=$(awk '/VmRSS/{print $2}' /proc/$HPID/status); FD2=$(find /proc/$HPID/fd -maxdepth 1 -type l | wc -l)
          tc filter show dev br-lan ingress > "$REPORT_DIR/tc-lan.txt"
          tc filter show dev pppoe-wan ingress > "$REPORT_DIR/tc-wan.txt"

          cat > "$REPORT_DIR/gateway-summary.json" <<JSON
          {"baseline_tcp":true,"baseline_udp":true,"honk_tcp":true,"honk_udp":true,"dns_intercept":true,"direct_health":true,"reloads":10,"tcp_after_each_reload":true,"stream_bytes":16777216,"parallel_tcp_attempted":100,"parallel_tcp_successful":100,"udp_attempted":200,"udp_successful":200,"wan_recreate":true,"rss_kb_before":$RSS0,"rss_kb_after_load":$RSS1,"rss_kb_final":$RSS2,"fd_before":$FD0,"fd_after_load":$FD1,"fd_final":$FD2}
          JSON
          cat "$REPORT_DIR/gateway-summary.json"
          SH
          chmod +x /tmp/run_gateway_baseline.sh
          sudo -E /tmp/run_gateway_baseline.sh 2>&1 | tee "$REPORT_DIR/run.log"

      - name: Write summary
        if: always()
        run: |
          { echo '# honk beta35 gateway baseline validation'; [ ! -f "$REPORT_DIR/gateway-summary.json" ] || { echo '```json'; cat "$REPORT_DIR/gateway-summary.json"; echo '```'; }; } | tee "$REPORT_DIR/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honk-beta35-baseline-results
          path: /tmp/honk-baseline-results
          if-no-files-found: error
          retention-days: 7
